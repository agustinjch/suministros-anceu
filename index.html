<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content: sin esto, Android usa el default
      resizes-visual, donde el teclado tapa la pantalla pero la pagina NO se
      reajusta, y los botones de accion se quedan debajo del teclado.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Suministros Anceu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
